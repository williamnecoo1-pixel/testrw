name: Filter VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *' # كيخدم كل 6 سوايع
  workflow_dispatch: # باش تقدر تشغلو يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run script
        run: python main.py # بدل main.py بالسمية ديال الملف ديالك
        
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add reality_configs.txt
          git commit -m "Update reality configs" || exit 0
          git push
