name: Filter VLESS Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # ✅ تحديث
        
      - name: Set up Python
        uses: actions/setup-python@v5 # ✅ تحديث
        with:
          python-version: '3.12'     # ✅ يفضل 3.12 على 3.10
          
      - name: Run script
        run: python main.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add reality_configs.txt
          git commit -m "Update reality configs" || exit 0
          # ✅ هاد السطر كيتفادى مشكل الـ Push Conflict
          git pull origin main --rebase || true
          git push
